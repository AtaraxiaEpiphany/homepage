# Build the static web app and publish it to GitHub Pages.
#
# The shell backend is NOT hosted here (Pages is static): point VITE_WS_URL /
# VITE_API_URL at a reachable backend via repository *Actions Variables*
# (Settings → Secrets and variables → Actions → Variables). Without them the
# site still deploys and renders its offline overlay.
name: deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
