# /etc/tmux/theme-light.conf — Everforest (Light) palette
# Vendored from ~/.config/tmux/theme-light.conf for the homepage container.
# Applied by: Prefix+T toggle (see /etc/tmux.conf).
# Also drives the fzf colors of the Prefix+Space content picker.
set -g @theme "light"

# ---- Status bar: soft paper background, slate text ----
set -g status-style "bg=#f2efdf,fg=#5c6a72"
set -g status-left "#[fg=#498b7e,bold] ⬚ tmux #[fg=#939f91]#S #[default]"
set -g status-right "#[fg=#939f91]%m-%d #[fg=#498b7e]%H:%M "
setw -g window-status-format "#[fg=#939f91] #I:#W "
setw -g window-status-current-format "#[fg=#fdf6e3,bg=#498b7e,bold] #I:#W "
setw -g window-status-activity-style "fg=#e66868"
setw -g window-status-bell-style "fg=#e66868,bold"

# ---- Pane borders & pane numbers (prefix+q) ----
set -g pane-border-style "fg=#d8d3bb"
set -g pane-active-border-style "fg=#498b7e"
set -g display-panes-colour "#939f91"
set -g display-panes-active-colour "#8da101"

# ---- Popups (launcher / overlay border & title) & messages ----
set -g popup-border-style "fg=#498b7e"
set -g message-style "bg=#e8e5d5,fg=#5c6a72"
set -g message-command-style "bg=#e8e5d5,fg=#5c6a72"

# ---- Copy-mode selection ----
set -g mode-style "bg=#498b7e,fg=#fdf6e3"
