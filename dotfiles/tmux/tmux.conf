# /etc/tmux.conf — container edition of the user's daily tmux config.
# Differences from ~/.tmux.conf on the real machine:
#   - Everforest dark/light palettes vendored next to this file; theme toggle
#     is tmux-native (no ~/.config/tmux, HOME is an ephemeral tmpfs here).
#   - tlauncher (desktop app panel) replaced by a centered fzf picker over
#     /home/dev/content that hands the pick to `open` in the invoking pane.

# ================= Basics =================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # 24-bit true color
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 10
set -g focus-events on
set -g detach-on-destroy off                # Stay in tmux after the window is killed
set -g allow-passthrough on                 # Forward DCS-wrapped sequences (OSC 7770 open)

# ================= Prefix key: Ctrl+r =================
unbind C-b
set -g prefix C-r
bind C-r send-prefix

# ================= Split panes =================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"    # Prefix+|   split left/right
bind - split-window -v -c "#{pane_current_path}"    # Prefix+-   split top/bottom
bind c new-window -c "#{pane_current_path}"

# Focus movement: Alt+hjkl without prefix (vim style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize splits: Prefix+H/J/K/L (repeatable)
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10

# ================= Fullscreen toggle =================
bind z resize-pane -Z

# ================= Centered popup: content file launcher =================
# Prefix+Space → 60%×40% fzf over the content dir; the pick is typed into the
# invoking pane as `open '<path>'`, so the OSC 7770 flows to the page viewer
# (popup output itself never reaches the outer terminal).
# NOTE: display-popup does NOT format-expand its shell command, so the pane
# must be addressed via $TMUX_PANE (set in the popup's environment), not
# #{pane_id}.
bind Space display-popup -E -T " open file " -w 60% -h 40% \
    -d "#{pane_current_path}" \
    "f=$(fd --type f --exclude .git . /home/dev/content 2>/dev/null | fzf --preview='bat --color=always {}') && tmux send-keys -t \"\$TMUX_PANE\" \"open '\$f'\" Enter"

# ================= Fullscreen overlay / scratch popup =================
bind O display-popup -E -T " Fullscreen Overlay (type exit to close) " -w 100% -h 100% \
    -d "#{pane_current_path}" "$SHELL"
bind F display-popup -E -T " Shell " -w 60% -h 50% \
    -d "#{pane_current_path}" "$SHELL"

# ================= Window management =================
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left previous-window
bind -n M-Right next-window
bind q display-panes
bind x kill-pane
bind Q confirm-before kill-window

# ================= Copy mode (vi) =================
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ================= Appearance: Everforest dual theme (dark default) =================
# Vendored palettes live beside this file (/etc/tmux/theme-{dark,light}.conf).
# Prefix+T flips live via the @theme option — no helper script, nothing persisted.
set -g status-position top
set -g status-left-length 40
set -g status-justify centre
set -g pane-border-lines single
set -g display-time 1500
set -g display-panes-time 2000
set -g @theme "dark"
source-file /etc/tmux/theme-dark.conf
bind T if-shell "[ '#{@theme}' = 'dark' ]" \
    "set -g @theme light; source-file /etc/tmux/theme-light.conf; display-message '✓ Theme: light (Everforest)'" \
    "set -g @theme dark; source-file /etc/tmux/theme-dark.conf; display-message '✓ Theme: dark (Everforest)'"

# ================= Misc =================
bind r source-file /etc/tmux.conf \; display-message "✓ Reloaded"
