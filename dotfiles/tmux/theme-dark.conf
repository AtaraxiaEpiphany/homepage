# /etc/tmux/theme-dark.conf — Everforest (Dark) palette
# Vendored from ~/.config/tmux/theme-dark.conf for the homepage container.
# Applied by: tmux startup / Prefix+T (see /etc/tmux.conf).
# Also drives the fzf colors of the Prefix+Space content picker.
set -g @theme "dark"

# ---- Status bar (explicit bg: self-contained regardless of terminal bg) ----
set -g status-style "bg=#1e2326,fg=#d3c6aa"
set -g status-left "#[fg=#7daea3,bold] ⬚ tmux #[fg=#85928a]#S #[default]"
set -g status-right "#[fg=#85928a]%m-%d #[fg=#7daea3]%H:%M "
setw -g window-status-format "#[fg=#85928a] #I:#W "
setw -g window-status-current-format "#[fg=#1e2326,bg=#7daea3,bold] #I:#W "
setw -g window-status-activity-style "fg=#e67e80"
setw -g window-status-bell-style "fg=#e67e80,bold"

# ---- Pane borders & pane numbers (prefix+q) ----
set -g pane-border-style "fg=#3a464c"
set -g pane-active-border-style "fg=#7daea3"
set -g display-panes-colour "#d3c6aa"
set -g display-panes-active-colour "#a7c080"

# ---- Popups (launcher / overlay border & title) & messages ----
set -g popup-border-style "fg=#7daea3"
set -g message-style "bg=#2b3339,fg=#d3c6aa"
set -g message-command-style "bg=#2b3339,fg=#d3c6aa"

# ---- Copy-mode selection ----
set -g mode-style "bg=#7daea3,fg=#1e2326"
